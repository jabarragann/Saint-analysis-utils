# List of Transformations used in ambf_tf_plugin
# Author: Hisashi Ishida (hishida3@jhu.edu)
# Date: 09.09.2024

transformations:
  - TF world-atracsys_drill_marker
  - TF marker_body-drill_tip
  - TF drill_tip-drill_body

TF world-atracsys_drill_marker: # Move drill with atracsys measurements
  parent: World
  child: marker
  type: ROS
  # Example
  # rostopic name: /atracsys/pointer_tool/measured_cp
  rostopic name: <MARKER_NAMESPACE>/measured_cp
  # Publishes /ambf/tf_plugin/tracking_valid (std_msgs/Bool) for multiview_panels
  # to gray out the navigation views. Only one tracked tool is supported.
  tracking status:
    timeout ms: 50   # valid -> invalid after this long without a valid sample
    recover ms: 200  # invalid -> valid after valid samples for this long (anti-flicker)

#ADD HERE the pivot calibration transform.
TF marker_body-drill_tip: 
  parent: marker
  child: drill_tip # sim_assisted_drill_tip_reference
  type: FIXED
  transformation: # from pivot calibration
    # Pivot performed on 06-01-2026 by Hisashi on 4mm
    # position: {x: 0.107766, y: -0.124998, z: -0.0536181} # Hisashi Generated
    # Mean calibration error: 0.000313192

    # Pivot performed on 06-02-2026 on 4mm
    # position: {x: 0.10745, y: -0.125701, z: -0.0542}
    # Mean calibration error: 0.000281953
    
    # Pivot performed on 07-25-2026
    position: {x: -0.130764, y: -0.12647, z: 0.054971}
    Mean calibration error: 0.000265385

    orientation: { r: 0.0, p: 0.0, y: 0.0 }


## This sets the drill body orientation with respect to the drill reference body.
# This value came from doing two pivot calibrations with shafts of different lenghts
# This enables you to calculate the drill's body angle with respect to the ref body.
TF drill_tip-drill_body:
  parent: drill_tip
  child: drill_body_<DRILL_SIZE>mm
  type: FIXED
  transformation:
    position: { x: 0.0, y: 0.0, z: 0.0 }
    orientation: { r: 0.0, p: 0.0, y: 2.84 } # For handheld drill. This should be around 117.4 degrees acording to ADF file
